name: tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: pytest (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: fp-companion
          auto-activate: true
          python-version: "3.11"

      - name: Install fp-companion
        run: python -m pip install -e apps/fp-companion

      - name: Run tests
        working-directory: apps/fp-companion
        run: python -m pytest -q

      - name: Qt offscreen smoke test
        working-directory: apps/fp-companion
        run: python ../../scripts/verify_qt.py
